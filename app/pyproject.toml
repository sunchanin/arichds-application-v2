[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arichds"
version = "0.1.0"
description = "ARICHDS Application — Windows meter-monitoring app (M1 walking skeleton)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # ─── Web framework (API + serves the SPA from one origin) ─────────────────
    "fastapi[standard]>=0.141",
    "uvicorn[standard]>=0.32",
    # ─── Config ───────────────────────────────────────────────────────────────
    "pydantic-settings>=2.7",
    # ─── Database — one SQLite, one Alembic ───────────────────────────────────
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    # ─── Licensing — Ed25519 (SPEC §3.9) ──────────────────────────────────────
    "cryptography>=43",
    # ─── Auth — user JWT only (SPEC §3.2, docs/lib-notes/m2-auth.md) ──────────
    "pyjwt>=2.13",
    "bcrypt>=5.0",
    # ─── DLMS/COSEM acquisition (vendored GX*.py wrap these) ──────────────────
    "gurux-dlms>=1.0.196",
    "gurux-common>=1.0.13",
    "gurux-net>=1.0.23",
    "gurux-serial>=1.0.21",
    "pyserial>=3.5",
    # ─── Billing capture — PDF/xlsx (M6b issue #22), PNG a headless screenshot
    # (M7 slice 4 issue #35, retired by ADR 0017/issue #38) ────────────────────
    # fpdf2/openpyxl pure Python (no Cairo/Pango/native ext), pinned at the
    # versions v1's renderers are field-proven against — see
    # docs/lib-notes/fpdf2-and-openpyxl.md. Pillow is declared here NOT because
    # anything in app/ renders with it any more (ADR 0017 retired capture/png.py,
    # docs/lib-notes/pillow-imagedraw.md) but because fpdf2 itself hard-depends
    # on it (`Pillow!=9.2.*,>=8.3.2`, verified via `importlib.metadata` on the
    # installed fpdf2 2026-08-22) — removing this line changes nothing about
    # what gets installed, so it stays as an honest declaration of a transitive
    # dependency rather than an implicit one.
    "fpdf2>=2.8.7",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    # `websockets` speaks the Chrome DevTools Protocol for the headless-
    # screenshot Billing capture renderer (`capture/screenshot.py`, ADR 0017,
    # issue #38). Not a new install — it already arrives transitively via
    # `uvicorn[standard]` and is present at 17.0.1 in this venv — but app/ now
    # imports it directly, so it is promoted to a declared dependency, the
    # same call this file already made for Pillow above.
    "websockets>=17.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Parallel test execution. The suite is CPU-bound on fixture setup and this
    # machine has 16 cores; `pytest -n auto` is the difference between a gate
    # that runs in a minute and one agents skip because it costs five.
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "ruff>=0.6",
    "pyinstaller>=6.6",
]

# FastAPI CLI entrypoint — `fastapi dev` / `fastapi run` read this.
[tool.fastapi]
entrypoint = "arichds.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arichds = ["licensing/*.pem"]

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

# ─── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 120
# Vendored Gurux wrappers are copied verbatim from v1 — never reformatted.
extend-exclude = ["src/arichds/vendor/gurux"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# E501 (line-too-long) is handled by the formatter, not the linter.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["arichds"]

[tool.ruff.lint.per-file-ignores]
# GX*.py files are adapted from the Gurux DLMS library which uses camelCase
# conventions throughout. Renaming would break API compatibility (ported from
# cewe-worker/ruff.toml). Kept alongside `extend-exclude` so the exemptions
# still apply if the exclusion is ever lifted.
"src/arichds/vendor/gurux/GXDLMSReader.py" = ["N802", "N803", "N806", "F403", "SIM115", "E721"]
"src/arichds/vendor/gurux/GXSettings.py" = ["N802", "N803", "N806"]
"src/arichds/vendor/gurux/GXDLMSSecureClient2.py" = ["N802", "N803", "N806"]
# The vendor package deliberately mutates sys.path before importing the flat
# GX* modules (they import each other by bare name — copied verbatim).
"src/arichds/vendor/gurux/__init__.py" = ["E402"]
