# Alembic config for the ARICHDS CLI workflow (`alembic revision --autogenerate`).
#
# The running application does NOT read this file — it builds an in-memory
# Config in arichds.db.migrate so a frozen exe has no dependency on a .ini
# sitting next to it. Keep the two in sync: script_location must point at the
# same migrations package.

[alembic]
script_location = src/arichds/migrations
prepend_sys_path = src
path_separator = os

# Left blank on purpose: env.py falls back to the app's configured database
# (ARICHDS_DATA_DIR/arichds.db) when no URL is supplied.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
